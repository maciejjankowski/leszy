<!doctype html>
<html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-ssot="check.title"></title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow-x: hidden; }
  .layout { display: grid; grid-template-columns: minmax(0, 560px); justify-content: center; gap: 16px; padding: max(16px, env(safe-area-inset-top)) 16px 24px; }
  @media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 560px) 360px; align-items: start; } }
  #qrBox { text-align: center; }
  #qr { background: #fff; padding: 10px; border-radius: 12px; display: inline-block; }
  #count { font-size: 2.6em; text-align: center; margin: .1em 0 .3em; }
  #go { width: 100%; margin-top: 6px; }
  .label { font-size: .8em; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 16px 0 6px; }
  #map { width: 100%; aspect-ratio: 1; max-height: 70vh; background: #ffffff; border-radius: 12px; display: block; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  aside .label:first-child { margin-top: 0; }
  .grid { overflow-x: auto; }
  table { border-collapse: collapse; font-size: .8em; }
  th, td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; white-space: nowrap; }
  tr.sus td { color: var(--warn); }
  td.dead { color: #fff; background: var(--hot); font-weight: bold; }
  td.ok { color: var(--ok); } td.bad { color: var(--hot); } td.self { color: var(--dim); }
  input.tape { width: 4.5em; padding: .2em; }
  button.hot { border-color: var(--hot); color: var(--hot); }
  #countCap { margin: 0; }
  #toasts { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; z-index: 50; max-width: min(90vw, 340px); }
  .toast { background: #eeece6; border: 1px solid var(--ok); color: var(--fg); padding: 8px 12px; border-radius: 10px; font-size: .9em; box-shadow: 0 4px 14px rgba(0,0,0,.4); animation: tin .25s ease-out; }
  .toast.warn { border-color: var(--warn); }
  @keyframes tin { from { transform: translateY(8px); opacity: 0; } }
</style>
<div class="layout">
  <main>
    <h1 data-ssot="check.h1"></h1>
    <div id="guide" class="card" style="margin-top:0;border-color:var(--accent)">

    <details id="settings"><summary data-ssot="check.settings.summary"></summary>

    <p class="muted" id="status" style="text-align:center"></p>

      <p class="row"><label><span data-ssot="check.settings.gain"></span> <select id="gain"><option value="0.3" data-ssot="check.settings.gain_30"></option><option value="0.6" data-ssot="check.settings.gain_60"></option><option value="0.9" data-ssot="check.settings.gain_90"></option></select></label> <span class="muted" data-ssot="check.settings.gain_help"></span></p>

    </details>
    <p class="label" data-ssot="check.map.label"></p>
    <canvas id="map"></canvas>
    <p class="muted" id="fit" style="text-align:center"></p>
    <p class="muted" data-ssot="check.map.hint" style="text-align:center"></p>
  </main>
  <aside>
    <p class="label" data-ssot="check.matrix.label"></p>
    <p class="muted" id="matrixHelp"></p>
    <div class="grid" id="matrix"></div>
    <p class="label" data-ssot="check.calibration.label"></p>

    <p class="label" data-ssot="check.latency.label"></p>

  </aside>
</div>
<div id="toasts"></div>
<script src="ssot.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="ranging.js"></script>
<script src="fusion.js"></script>
<script src="guide.js"></script>
<script>
SSOT.ready.then(() => { // every string and threshold below comes from ssot/*.yaml
const $ = s => document.querySelector(s), ROOM = 'test', t = SSOT.t, P = SSOT.params, R = P.rollcall, PH = P.phones, DT = P.detection;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hub = (a, body) => fetch('party.php?a=' + a + '&room=' + ROOM, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' }).then(r => r.json());
const joinUrl = location.href.replace(/check\.html.*$/, 'party.html') + '?room=' + ROOM;
(async () => { // the QR carries this demo's join PIN when the gate allows it, so guests type nothing
  let pin = ''; try { pin = (await (await fetch('pin.php?qrinfo=1', { cache: 'no-store' })).json()).pin || ''; } catch (e) {}
  const u = joinUrl + (pin ? '&pin=' + pin : '');
  $('#url').textContent = u;
  $('#selfJoin').href = u; // join with this device in a new window
  const w = Math.min(260, innerWidth - 80);
  try { new QRCode($('#qr'), { text: u, width: w, height: w }); } catch (e) { $('#qr').textContent = t('check.qr.missing') + ' ' + u; }
})();
$('#go').onclick = () => hub('admin', { cmd: 'rollcall', band: $('#band').value, slot: walker ? R.walker_slot_s : +$('#slot').value, walker: walker || '', frac: +$('#frac').value, gain: +$('#gain').value }).then(j => {
  const n = j.party.order.length;
  $('#status').textContent = n < PH.min_for_rollcall ? t('check.status.need_phones', { need: PH.min_for_rollcall }) : t('check.status.beeping', { s: Math.round(n * (+$('#slot').value) + 5) });
});
$('#pileBtn').onclick = async () => { pileCal = { rounds: [], need: R.pile_rounds }; toast(t('check.toast.pile_start', { n: R.pile_rounds })); for (let i = 0; i < R.pile_rounds; i++) { await hub('admin', { cmd: 'rollcall', band: $('#band').value, slot: +$('#slot').value, frac: +$('#frac').value, gain: +$('#gain').value }); await sleep(R.pile_wait_ms); } };
$('#saveLog').onclick = async () => { if (!lastSnap) { toast(t('check.toast.no_round'), true); return; } try { await hub('log', { kind: 'map', note: $('#note').value.trim(), ...lastSnap }); $('#saved').textContent = t('check.actions.saved', { time: new Date().toLocaleTimeString() }); } catch (e) { toast(t('check.toast.not_saved', { err: e.message }), true); } };
$('#clearCal').onclick = () => { tape = {}; touches = {}; pileOff = {}; store('dp_pileoff', '{}'); store('dp_tape', '{}'); store('dp_touch', '{}'); last = ''; };
$('#reset').onclick = () => { hub('admin', { cmd: 'reset' }); last = ''; walker = null; trail = []; view = null; target = null; frozen = null; shown = {}; for (const k of Object.keys(filt)) delete filt[k]; };
let loop = false, loopBusy = false;
$('#loop').onclick = () => { loop = !loop; $('#loop').classList.toggle('on', loop); if (loop) $('#go').click(); };
// Detection on the calibrated map: phones that hear a rotor at the same pitch (within 5 %) vote with their level; 3+ placed phones give a fix.
function detection(d, p) {
  const now = d.t / 1000; p.now = now; const nmOf = i => (p.names && p.names[i]) || (d.members.find(m => m.id === i) || {}).name || i;
  const fresh = d.members.filter(m => m.det && now - m.det.t < DT.fresh_s);
  const heard = fresh.filter(m => m.det.det);
  let f0 = null; if (heard.length) { const fs = heard.map(m => m.det.f0).sort((a, b) => a - b); f0 = fs[fs.length >> 1]; }
  hearing = heard.filter(m => Math.abs(m.det.f0 - f0) / f0 < DT.pitch_tolerance).map(m => m.id);
  const nodes = hearing.filter(i => target && target[i]).map(i => ({ x: target[i].x, y: target[i].y, level: fresh.find(m => m.id === i).det.level }));
  const fix = nodes.length >= DT.min_nodes_for_fix ? Fusion.localize(nodes) : null;
  if (fix) { if (!tracker) tracker = new Fusion.Tracker(1); const tr = tracker.update(now, fix); droneFix = { x: tr.x, y: tr.y, err: fix.err, speed: tr.speed, heading: tr.heading, f0, t: now }; }
  else if (droneFix && now - droneFix.t > DT.fix_hold_s) { droneFix = null; tracker = null; }
  const st = $('#detStatus');
  if (!fresh.length) { st.textContent = ''; st.hidden = true; return; }
  st.style.color = hearing.length ? 'var(--hot)' : 'var(--dim)';
  st.hidden = detectMode || !hearing.length; // in detect mode the strip itself says it; during calibration only an alarm interrupts
  st.textContent = hearing.length ? t('detect.drone', { list: hearing.map(nmOf).join(', '), f0: Math.round(f0) }) + (droneFix ? t('detect.fix', { x: droneFix.x.toFixed(1), y: droneFix.y.toFixed(1), err: droneFix.err.toFixed(1), speed: droneFix.speed.toFixed(1) }) : nodes.length < DT.min_nodes_for_fix ? t('detect.need_map', { need: DT.min_nodes_for_fix }) : '')
    : t('detect.silence', { n: fresh.length });
}
// Guided flow. The states, their buttons and the order they come in are in ssot/flow.yaml (Guide.view reads it);
// this part draws the strip and runs the actions the flow names. Detection is one press away from every state.
let skipped = { join: false }, forced = null, runId = 0, lastLive = null, lastP = null, moreSig = '', gCtx = { ref: null, uncal: [], liveIds: [] };
function abortRun() { runId++; measure = null; if (touchCal) touchCal.busy = 0; } // a running loop notices the new runId and stops
const ACT = {
  detect() { abortRun(); forced = null; detectMode = true; store('dp_mode', 'detect'); },
  back_to_calibration() { detectMode = false; store('dp_mode', ''); },
  skip_join() { skipped.join = true; forced = null; },
  join_next() { skipped.join = true; forced = null; },
  back_home(a) { location.href = a.href; },
  back_to_join() { forced = 'join'; skipped.join = false; },
  back_to_touch() { // measure the phones again, one by one, against the same reference
    const ref = gCtx.ref, queue = gCtx.liveIds.filter(i => i !== ref);
    if (!queue.length) { ACT.back_to_join(); return; }
    touchCal = { ref, queue, cur: queue[0], busy: 0 };
  },
  skip_phone() { // leave this phone as it is; it is not asked again until it rejoins
    if (!touchCal) return; const cur = touchCal.cur;
    if (cur && touches[cur] === undefined && pileOff[cur] === undefined) { touches[cur] = { walker: touchCal.ref, raw: PH.zero_pair_m, round: 0, t: Date.now(), skipped: true }; store('dp_touch', JSON.stringify(touches)); }
    touchCal.queue.shift(); touchCal.cur = touchCal.queue[0]; if (!touchCal.cur) touchCal = null;
  },
  skip_all() { // skipped phones keep whatever map position they had
    for (const i of gCtx.uncal) touches[i] = { walker: gCtx.ref, raw: PH.zero_pair_m, round: 0, t: Date.now(), skipped: true };
    touchCal = null; store('dp_touch', JSON.stringify(touches));
  },
  cancel_run() { abortRun(); },
  touch_measure() { return runTouch(); },
  measure_run() { return runMeasure(); },
};
function doAction(a) { const r = ACT[a.id](a); last = ''; redraw(); return r; }
function redraw() { if (lastLive) guide(lastLive, lastP); }
$('#gRef').onchange = () => { touchCal = null; last = ''; redraw(); }; // another reference phone: start the queue again
function guide(live, p) {
  lastLive = live; lastP = p;
  const liveIds = live.map(m => m.id), nmOf = i => (p.names && p.names[i]) || (live.find(m => m.id === i) || {}).name || i;
  const sel = $('#gRef');
  const ref = touchCal ? touchCal.ref : (sel.value && liveIds.includes(sel.value) ? sel.value : liveIds[0]);
  const uncal = liveIds.filter(i => i !== ref && !(touches[i] && touches[i].walker === ref) && pileOff[i] === undefined);
  gCtx = { ref, uncal, liveIds };
  if ([...sel.options].map(o => o.value).join(',') !== liveIds.join(',')) { sel.textContent = ''; for (const i of liveIds) sel.appendChild(new Option(nmOf(i), i)); if (liveIds.includes(ref)) sel.value = ref; }
  const env = { live: live.length, uncal: uncal.length, touchActive: !!touchCal, run: touchCal && touchCal.busy ? 'touch' : measure ? 'measure' : null, detectMode, forced, skipped };
  const v = Guide.view(SSOT.flow, env, P);
  if (v.id === 'touch-calibrate' && !v.busy) {
    if (!touchCal) touchCal = { ref, queue: uncal.slice(), cur: uncal[0], busy: 0 };
    if (touchCal.cur && !liveIds.includes(touchCal.cur)) { touchCal.queue = touchCal.queue.filter(i => liveIds.includes(i)); touchCal.cur = touchCal.queue[0]; }
    if (!touchCal.cur) { touchCal = null; last = ''; return guide(live, p); }
  }
  const tr = R.touch_rounds, listening = live.filter(m => m.det && (p.now || Date.now() / 1000) - m.det.t < DT.fresh_s).length;
  const vars = v.id === 'join' ? { n: live.length, need: PH.min_for_map }
    : v.id === 'touch-calibrate' ? (v.busy ? { cur: nmOf(touchCal.cur), ref: nmOf(touchCal.ref), i: touchCal.busy, n: tr, s: Math.round(tr * (R.start_delay_ms + 6 * (+$('#slot').value) * 1000 + R.settle_ms) / 1000) } : { cur: nmOf(touchCal.cur), ref: nmOf(touchCal.ref), queue: touchCal.queue.map(nmOf).join(', '), n: tr })
    : v.id === 'measure' ? (v.busy ? { i: Math.min(measure.rounds.length + 1, measure.need), n: measure.need, s: Math.round(measure.need * (R.start_delay_ms + 6 * (+$('#slot').value) * 1000 + R.settle_ms) / 1000) } : { n: R.measure_rounds })
    : { n: listening, total: live.length, need: DT.min_nodes_for_fix };
  const drone = v.id === 'detect' && hearing.length > 0;
  $('#gStep').textContent = v.step ? t('guide.step', { n: v.step, total: v.total }) : t('guide.step_detect');
  $('#gTitle').textContent = t(drone ? v.titleAlt : v.title, vars); $('#gTitle').style.color = drone ? 'var(--hot)' : '';
  $('#gText').textContent = drone ? $('#detStatus').textContent : t(v.instruction, vars);
  const extra = v.busy ? '' : v.id === 'touch-calibrate' ? (pileRes != null ? String(pileRes) : '') : v.id === 'measure' ? (lastResult || (pileRes != null ? String(pileRes) : '')) : '';
  $('#gStat').textContent = [v.status ? t(v.status, vars) : '', extra].filter(Boolean).join(' · ');
  const b = $('#gBtn'); b.hidden = !v.primary;
  if (v.primary) { b.textContent = t(v.primary.label, vars); b.disabled = !v.primary.enabled; b.onclick = () => doAction(v.primary); }
  const labels = v.secondary.map(a => t(a.label, vars)), sig = v.id + (v.busy ? '!' : '') + v.secondary.map((a, i) => a.id + labels[i]).join('|');
  if (sig !== moreSig) { // rebuild the secondary buttons only when the set changes, so a tap is never lost to a redraw
    moreSig = sig; const box = $('#gMore'); box.textContent = '';
    v.secondary.forEach((a, i) => { const el = document.createElement('button'); el.textContent = labels[i]; el.dataset.act = a.id; if (a.id === 'detect') el.className = 'big hot'; el.onclick = () => doAction(a); box.appendChild(el); });
  }
  $('#gRefRow').hidden = !(v.id === 'touch-calibrate' && !v.busy && touchCal && !touchCal.started && live.length >= 2);
}
// one phone next to the reference: two rounds, raw two-way distance ref-phone, offset relative to the reference (which counts as zero)
async function runTouch() {
  const tc = touchCal; if (!tc || tc.busy) return;
  const my = ++runId, slot = +$('#slot').value, band = $('#band').value, frac = +$('#frac').value, gain = +$('#gain').value;
  try {
    const start = (await hub('data')).party.round; tc.started = true;
    for (let i = 1; i <= R.touch_rounds; i++) {
      if (my !== runId) return;
      tc.busy = i; last = ''; redraw();
      await hub('admin', { cmd: 'rollcall', band, slot, frac, gain }); await sleep(R.start_delay_ms + 6 * slot * 1000 + R.settle_ms);
    }
    if (my !== runId) return;
    const d = await hub('data'), c = Ranging.soundSpeed(+$('#temp').value || R.temp_default_c), raws = [];
    if (my !== runId) return;
    for (let k = 1; k <= R.touch_rounds; k++) {
      const r = start + k, heard = {}; for (const m of d.members) { const h = m.round === r ? m.heard : (m.prev || []).find(x => x && x.round === r); if (h) heard[m.id] = h.heard || h; }
      if (heard[tc.ref] && heard[tc.cur]) for (const x of Ranging.pairDistances([tc.ref, tc.cur], heard, { c })) raws.push(x.raw);
    }
    tc.busy = 0;
    if (!raws.length) { toast(t('check.toast.touch_failed', { name: (lastP && lastP.names && lastP.names[tc.cur]) || tc.cur }), true); last = ''; redraw(); return; }
    const raw = raws.reduce((a, b) => a + b, 0) / raws.length;
    touches[tc.cur] = { walker: tc.ref, raw, round: start + R.touch_rounds, t: Date.now() }; delete pileOff[tc.cur]; delete pileOff[tc.ref]; store('dp_touch', JSON.stringify(touches)); store('dp_pileoff', JSON.stringify(pileOff));
    pileRes = t('check.result.touch_last', { cm: (raw * 100).toFixed(0) }) + (raws.length > 1 ? t('check.result.touch_spread', { cm: ((Math.max(...raws) - Math.min(...raws)) * 100).toFixed(0) }) : '');
    tc.queue.shift(); tc.cur = tc.queue[0]; if (!tc.cur) { touchCal = null; pileRes = t('check.result.touch_done'); }
  } catch (e) { if (my === runId) { tc.busy = 0; toast(t('check.status.offline'), true); } }
  last = ''; redraw();
}
async function runMeasure() {
  if (measure) return;
  const my = ++runId, mine = measure = { rounds: [], need: R.measure_rounds }; lastResult = ''; redraw();
  try {
    const slot = +$('#slot').value;
    for (let i = 0; i < R.measure_rounds; i++) {
      if (my !== runId) return;
      await hub('admin', { cmd: 'rollcall', band: $('#band').value, slot, frac: +$('#frac').value, gain: +$('#gain').value }); await sleep(R.start_delay_ms + 6 * slot * 1000 + R.settle_ms);
    }
    const t0 = Date.now(); while (mine.rounds.length < R.measure_rounds && Date.now() - t0 < R.collect_timeout_ms) { if (my !== runId) return; await sleep(500); }
    if (my !== runId) return;
    const snap = lastSnap, withTape = snap ? snap.pairs.filter(x => x.tape) : [];
    const errs = withTape.map(x => Math.abs(x.d - x.tape) * 100), mean = errs.length ? errs.reduce((a, b) => a + b, 0) / errs.length : null, max = errs.length ? Math.max(...errs) : null;
    lastResult = [mine.rounds.length < R.measure_rounds ? t('check.result.partial', { n: mine.rounds.length }) : '',
      mean != null ? t('check.result.error', { mean: mean.toFixed(0), max: max.toFixed(0), n: errs.length }) + ' · ' + t(mean <= R.ok_mean_error_cm ? 'check.result.ok' : 'check.result.too_much') : t('check.result.no_tape'),
