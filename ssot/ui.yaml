# Every user-facing string of check.html (laptop base) and party.html (phone). Polish, written directly.
# {name} is replaced from code. {n|jeden|kilka|wiele} picks the Polish plural form for the number n
# (1 | 2-4, not 12-14 | the rest). Text between ** and ** is bold in static lines.
# Edit, then run: node tools/build_ssot.js   (from the project folder)

