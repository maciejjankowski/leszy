# Every number the program uses. Field values from 2026-10-20 (DJI pair, real drone) where noted.
audio:
  sample_rate: 48000
  frame: 8192            # samples per analysis frame (~170 ms)
  hop_s: 0.1             # one analysis step every 100 ms
  ring_s: 4              # seconds of audio kept per device
band_hz: [100, 2000]     # rotor fundamental and harmonics of small and mid drones
clap_band_hz: [300, 8000]
sound_speed: 343.0
detect:
  on_db: 6               # a mic "hears" when band level is this far above its floor
  strong_db: 15          # one mic this loud counts without pitch agreement
  need_frames: 3         # consecutive hit frames to switch on (0.3 s)
  hold_s: 1.5            # stay on this long after the last hit
  f0_range_hz: [80, 1000]
  f0_agree: 0.05         # pitches within 5 % count as the same rotor (field: single-mic chains break, two mics agree)
  min_mics: 2
floor:
  window_s: 30           # adaptive floor = 10th percentile of the last 30 s, frozen while a drone is heard
  percentile: 10
locate:
  step_m: 0.05
  sigma_tdoa_s: 0.0001   # 0.1 ms = 3.4 cm
  sigma_level_db: 3.0
  srp_weight: 20       # cost of a pair whose correlation at the grid point is 0 instead of its peak
  min_conf: 3.0          # GCC-PHAT peak over window mean; field pairs read 3.5-6.5
  level_min_mics: 3
track:
  alpha: 0.5
  beta: 0.2
output:
  print_every_s: 0.5
  heartbeat_s: 2.0
  post_timeout_s: 0.3
calibrate:
  noise_s: 10
  clap_window_s: 0.05
  clap_jump_db: 20      # newest 0.1 s peak of the differenced signal over the frame median
  point_s: 8
